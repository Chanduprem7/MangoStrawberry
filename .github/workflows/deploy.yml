name: Deploy Birthday Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Find build output
        run: |
          echo "===== HTML FILES ====="
          find . -type f \( -name "index.html" -o -name "_shell.html" \) -not -path "./node_modules/*" -print

          echo "===== DIST ====="
          if [ -d "dist" ]; then
            find dist -maxdepth 4 -type f -print
          fi

          echo "===== OUTPUT ====="
          if [ -d ".output" ]; then
            find .output -maxdepth 5 -type f -print
          fi

      - name: Prepare Pages site
        run: |
          rm -rf pages
          mkdir -p pages

          INDEX_FILE=$(find dist .output -type f -name "index.html" -not -path "*/node_modules/*" 2>/dev/null | head -n 1)
          SHELL_FILE=$(find dist .output -type f -name "_shell.html" -not -path "*/node_modules/*" 2>/dev/null | head -n 1)

          if [ -n "$INDEX_FILE" ]; then
            echo "Found index.html at: $INDEX_FILE"

            SOURCE_DIR=$(dirname "$INDEX_FILE")
            cp -R "$SOURCE_DIR"/. pages/

          elif [ -n "$SHELL_FILE" ]; then
            echo "Found _shell.html at: $SHELL_FILE"

            SOURCE_DIR=$(dirname "$SHELL_FILE")
            cp -R "$SOURCE_DIR"/. pages/
            cp "$SHELL_FILE" pages/index.html

          else
            echo "ERROR: No index.html or _shell.html was generated."
            exit 1
          fi

          echo "===== FINAL PAGES FILES ====="
          find pages -maxdepth 4 -type f -print

          echo "===== INDEX.HTML ====="
          ls -lh pages/index.html

          test -f pages/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./pages

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
