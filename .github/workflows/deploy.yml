name: Deploy Birthday Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Show build output
        run: |
          echo "===== BUILD OUTPUT ====="
          find . -maxdepth 5 -type f \
            \( -name "index.html" -o -name "_shell.html" \) \
            -not -path "./node_modules/*" \
            -print

          echo "===== DIST ====="
          if [ -d "dist" ]; then
            find dist -maxdepth 4 -type f -print
          fi

          echo "===== OUTPUT ====="
          if [ -d ".output" ]; then
            find .output -maxdepth 5 -type f -print
          fi

      - name: Prepare static site
        run: |
          rm -rf pages
          mkdir pages

          if [ -f "dist/_shell.html" ]; then
            cp -R dist/. pages/
            cp dist/_shell.html pages/index.html

          elif [ -f "dist/index.html" ]; then
            cp -R dist/. pages/

          elif [ -f ".output/public/_shell.html" ]; then
            cp -R .output/public/. pages/
            cp .output/public/_shell.html pages/index.html

          elif [ -f ".output/public/index.html" ]; then
            cp -R .output/public/. pages/

          else
            echo "ERROR: No HTML shell found."
            exit 1
          fi

          echo "===== FINAL SITE ====="
          find pages -maxdepth 4 -type f -print

          test -f pages/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./pages

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
